name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore FFApp.slnx

      - name: Build solution
        run: dotnet build FFApp.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test FFApp.slnx -c Release --no-build --filter "Category!=Integration"
